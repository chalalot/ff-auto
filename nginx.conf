server {
    listen 80;
    server_name _;

    # Serve React SPA
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (the JS bundle is ~650KB uncompressed)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        image/svg+xml;

    # Proxy API calls to FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }

    # Vite emits content-hashed filenames under /assets/, so they can be
    # cached forever — a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html.
    # index.html itself must not be cached: it is the pointer to the
    # current hashed bundle.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
